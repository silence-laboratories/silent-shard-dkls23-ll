# Basic set up for two package managers

version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Maintain dependencies for cargo
    cooldown:
      default-days: 7
    groups:
      routine-version-updates:
        applies-to: version-updates
        patterns:
          - '*'
    open-pull-requests-limit: 5
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      routine-version-updates:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      routine-version-updates:
        applies-to: version-updates
        patterns:
          - '*'
