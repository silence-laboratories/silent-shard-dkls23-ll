name: Continuous Integration

on:
  push:
    tags:
      - '*'
  # Manual build-only dry run. Release assets and npm publishing remain tag-only.
  workflow_dispatch:

permissions:
  contents: write   # GitHub release assets (softprops/action-gh-release)
  id-token: write   # npm OIDC trusted publishing (no stored NPM_TOKEN)

jobs:
  build_docker_images:
    strategy:
      max-parallel: 1
      matrix:
        os: [github-builder]
        arch: [amd64]
        include:
          - os: github-builder
            arch: amd64
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get Version
        id: version
        # Strip the leading 'v' for release tags. Manual runs use a valid
        # prerelease version so wasm-pack can still build package metadata.
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=0.0.0-dryrun.${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
            context: .
            file: Dockerfile
            platforms: linux/${{ matrix.arch }}
            build-args: VER=${{ steps.version.outputs.tag }}
            load: true
            tags: wasm-ll:latest
            # Persistent layer cache — on the self-hosted runner subsequent
            # builds reuse compiled layers (wasm-opt/wasm-pack/crate) instead
            # of a cold build every tag.
            cache-from: type=gha
            cache-to: type=gha,mode=max
      - name: Extract packages from image
        # Deterministic copy of the built pkg-* dirs out of the wasm-ll image.
        # --user keeps the files owned by the runner user so the persistent
        # self-hosted workspace can be cleaned by the next run's Checkout.
        run: |
          mkdir -p dist
          docker run --rm --user "$(id -u):$(id -g)" --entrypoint sh \
            -v "$PWD/dist:/out" wasm-ll -c \
            'cp -r /pkg/pkg-web /pkg/pkg-node /pkg/pkg-bundler /pkg/pkg-vrf-web /pkg/pkg-vrf-node /pkg/pkg-vrf-bundler /out/'
      - name: Archive Release
        # zip-release action needs the system 'zip' binary which isn't on the
        # self-hosted runner (and sudo isn't passwordless there) — use python3.
        run: |
          cd dist
          python3 -m zipfile -c "../npm-packages-${{ steps.version.outputs.tag }}-${{ matrix.platform }}-${{ matrix.arch }}.zip" .
          ls -lh "../npm-packages-${{ steps.version.outputs.tag }}-${{ matrix.platform }}-${{ matrix.arch }}.zip"
      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Upload release archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-release-archive
          path: npm-packages-${{ steps.version.outputs.tag }}-${{ matrix.platform }}-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 7
      - name: Setup Node for publish
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Upgrade npm (OIDC trusted publishing needs >= 11.5.1)
        run: npm install -g npm@11

      - name: Publish to npm
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        # Publish from the runner (all GitHub OIDC env vars present), not from
        # inside the container. npm CLI (>= 11.5.1) auto-exchanges the OIDC
        # token for a short-lived npm token via Trusted Publishing. No stored
        # NODE_AUTH_TOKEN: setup-node is used WITHOUT registry-url on purpose
        # so it does not inject the repo's npm token.
        # NOTE: provenance disabled — this repo is public, but npm/sigstore
        # provenance does not support self-hosted runners (E422), and the
        # publish runs on the github-builder fleet.
        # Prerelease versions (e.g. 1.2.0-pre.x) require --tag; publish them
        # under the 'next' dist-tag so they never become 'latest'.
        env:
          VERSION: ${{ steps.version.outputs.tag }}
          NPM_CONFIG_PROVENANCE: 'false'
        run: |
          PUB_TAG=""
          if [[ "$VERSION" == *-* ]]; then PUB_TAG="--tag next"; fi
          for pkg in pkg-web pkg-node pkg-bundler pkg-vrf-web pkg-vrf-node pkg-vrf-bundler; do
            (
              cd "dist/${pkg}"
              name=$(node -p "require('./package.json').name")
              ver=$(node -p "require('./package.json').version")
              on_reg=$(npm view "${name}@${ver}" version 2>/dev/null || true)
              if [ "${on_reg}" = "${ver}" ]; then
                echo "skip ${name}@${ver} (already published)"
              else
                # OIDC trusted publishing rate-limits sequential publishes in
                # one run (later packages fail ENEEDAUTH); retries succeed.
                # Same hardening sl-eddsa-ll got after hitting this on
                # 2026-08-31, where a plain loop published 3 of 6 then died.
                ok=0
                for attempt in 1 2 3 4 5; do
                  if npm publish $PUB_TAG; then
                    echo "published ${name}@${ver}"
                    ok=1
                    break
                  fi
                  echo "publish ${name}@${ver} attempt ${attempt} failed, retrying in 15s"
                  sleep 15
                done
                if [ "${ok}" != "1" ]; then
                  echo "FAILED to publish ${name}@${ver} after 5 attempts"
                  exit 1
                fi
              fi
            )
          done

  # ============================================================================
  # Generate + sign the Rust SBOM for the crate used by all WASM packages
  # ============================================================================
  sbom:
    name: Generate + sign Rust SBOM (CycloneDX)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0

      - name: Install cargo-cyclonedx
        uses: baptiste0928/cargo-install@v3.4.0
        with:
          crate: cargo-cyclonedx
          version: "0.5.9"

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Generate Rust SBOM
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="dev-${GITHUB_SHA::8}"
          fi
          mkdir -p sbom
          cargo cyclonedx \
            --manifest-path wrapper/wasm-ll/Cargo.toml \
            --all-features \
            --format json --spec-version 1.5 \
            --override-filename "sbom-silent-shard-dkls23-ll-${VERSION}.cdx"
          rm -f "sbom-silent-shard-dkls23-ll-${VERSION}.cdx.json"
          mv "wrapper/wasm-ll/sbom-silent-shard-dkls23-ll-${VERSION}.cdx.json" sbom/

      - name: Sign Rust SBOM (keyless)
        run: |
          set -euo pipefail
          for sbom in sbom/*.cdx.json; do
            cosign sign-blob --yes --bundle "${sbom}.bundle" "${sbom}"
          done

      - name: Verify Rust SBOM signature
        run: |
          set -euo pipefail
          CERTIFICATE_IDENTITY="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}"
          for sbom in sbom/*.cdx.json; do
            cosign verify-blob \
              --certificate-identity "${CERTIFICATE_IDENTITY}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              --bundle "${sbom}.bundle" "${sbom}"
          done

      - name: Upload Rust SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-sbom
          path: sbom
          if-no-files-found: error
          retention-days: 7

  # ============================================================================
  # Generate informational package-level SBOMs for every published npm package
  # ============================================================================
  npm-sbom:
    name: Generate npm package SBOMs
    runs-on: ubuntu-latest
    needs: build_docker_images
    permissions:
      contents: read
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: npm-packages
          path: dist

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Upgrade npm
        run: npm install -g npm@11

      - name: Generate npm SBOMs
        run: |
          set -euo pipefail
          mkdir -p npm-sbom
          for pkg in pkg-web pkg-node pkg-bundler pkg-vrf-web pkg-vrf-node pkg-vrf-bundler; do
            npm --prefix "dist/${pkg}" sbom --sbom-format cyclonedx > "npm-sbom/${pkg}.cdx.json"
          done

      - name: Upload npm SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: npm-sbom
          path: npm-sbom
          if-no-files-found: error
          retention-days: 7

  # ============================================================================
  # Publish the package archive and signed Rust SBOM to the GitHub Release
  # ============================================================================
  release:
    name: Publish GitHub Release
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    needs: [build_docker_images, sbom]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-release-archive
          path: ./artifacts

      - uses: actions/download-artifact@v4
        with:
          name: rust-sbom
          path: ./artifacts/sbom

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            artifacts/npm-packages-*.zip
            artifacts/sbom/*.cdx.json
            artifacts/sbom/*.cdx.json.bundle
          generate_release_notes: true
